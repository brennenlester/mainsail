<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ivyward</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="invite-error" class="invite-error" hidden>
        <h1 class="invite-error-title">Invite link invalid</h1>
        <p class="invite-error-body">
          This join link is broken or tampered with, so the shared world could
          not be opened. Nothing was changed on this device.
        </p>
        <button id="invite-error-start-fresh" type="button" class="invite-error-btn">
          Start a fresh game
        </button>
      </div>
      <div
        id="name-intro"
        class="name-intro"
        role="dialog"
        aria-modal="true"
        aria-labelledby="name-intro-title"
        hidden
      >
        <h1 id="name-intro-title" class="name-intro-title">Ivyward</h1>
        <p class="name-intro-body">What should we call you?</p>
        <form id="name-intro-form" class="name-intro-form" autocomplete="off">
          <label class="visually-hidden" for="name-intro-input">Your name</label>
          <input
            id="name-intro-input"
            class="name-intro-input"
            type="text"
            name="playerName"
            maxlength="16"
            required
            spellcheck="false"
            placeholder="Your name"
          />
          <p id="name-intro-error" class="name-intro-error" role="alert"></p>
          <button id="name-intro-submit" type="submit" class="name-intro-btn">
            Begin
          </button>
        </form>
      </div>
      <div
        id="village-gate-code"
        class="name-intro"
        role="dialog"
        aria-modal="true"
        aria-labelledby="village-gate-code-title"
        hidden
      >
        <h1 id="village-gate-code-title" class="name-intro-title">Village gate</h1>
        <p class="name-intro-body">Enter the four-digit code.</p>
        <form id="village-gate-code-form" class="name-intro-form" autocomplete="off">
          <label class="visually-hidden" for="village-gate-code-input"
            >Gate code</label
          >
          <input
            id="village-gate-code-input"
            class="name-intro-input"
            type="text"
            name="villageGateCode"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            required
            spellcheck="false"
            placeholder="····"
          />
          <p id="village-gate-code-error" class="name-intro-error" role="alert"></p>
          <button id="village-gate-code-submit" type="submit" class="name-intro-btn">
            Unlock
          </button>
          <button
            id="village-gate-code-cancel"
            type="button"
            class="name-intro-btn village-gate-code-cancel"
          >
            Cancel
          </button>
        </form>
      </div>
      <div id="playfield">
        <div id="game">
          <div id="touch-controls" class="touch-controls" aria-hidden="true">
            <div
              id="touch-stick-pad"
              class="touch-stick-pad"
              role="application"
              aria-label="Move"
            >
              <div id="touch-stick-knob" class="touch-stick-knob"></div>
            </div>
            <button
              id="touch-interact"
              type="button"
              class="touch-interact"
              aria-label="Interact"
            >
              E
            </button>
          </div>
        </div>
        <div id="quest-hud" class="quest-hud" aria-live="polite">
          <div id="quest-hud-summary" class="quest-hud-summary"></div>
          <div id="quest-hud-hint" class="quest-hud-hint"></div>
        </div>
        <div id="status-panel" aria-label="Player status">
          <div id="status-actions" class="status-actions">
            <button
              id="copy-invite-btn"
              type="button"
              class="status-invite-btn"
              hidden
            >
              Copy invite link
            </button>
            <button id="party-btn" type="button" class="status-codex-btn">
              Party
            </button>
            <button id="inventory-btn" type="button" class="status-codex-btn">
              Inventory
            </button>
            <button id="recipes-btn" type="button" class="status-codex-btn" hidden>
              Recipes
            </button>
            <button id="codex-btn" type="button" class="status-codex-btn" hidden>
              Codex
            </button>
            <button id="mute-audio-btn" type="button" class="status-mute-btn">
              Mute
            </button>
            <div class="status-overflow">
              <button
                id="status-overflow-btn"
                type="button"
                class="status-overflow-btn"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="status-overflow-menu"
                aria-label="More"
              >
                …
              </button>
              <div
                id="status-overflow-menu"
                class="status-overflow-menu"
                role="menu"
                hidden
              >
                <button
                  id="reset-game-btn"
                  type="button"
                  class="status-reset-btn"
                  role="menuitem"
                >
                  Reset game
                </button>
              </div>
            </div>
          </div>
          <div id="invite-url-box" class="invite-url-box" hidden>
            <label class="invite-url-label" for="invite-url-input"
              >Invite link (select and copy)</label
            >
            <input
              id="invite-url-input"
              class="invite-url-input"
              type="text"
              readonly
              spellcheck="false"
            />
            <button id="invite-url-dismiss" type="button" class="invite-url-dismiss">
              Done
            </button>
          </div>
          <div id="status-zone" class="status-line status-zone"></div>
          <div id="status-control-legend" class="status-line status-control-legend">E interact · WASD move</div>
          <div id="status-gate" class="status-line status-gate"></div>
          <div id="status-party" class="status-line status-party"></div>
          <div id="status-session" class="status-line status-session"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
